<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrati – AI Booking</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#f0f9ff', 100:'#e0f2fe', 500:'#0ea5e9', 600:'#0284c7', 700:'#0369a1' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex w-12 h-12 rounded-xl bg-brand-600 text-white items-center justify-center text-xl font-bold mb-3">A</div>
      <h1 class="text-2xl font-bold text-gray-900">AI Booking</h1>
      <p class="text-gray-500 text-sm mt-1">Crea l’account del tuo studio</p>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-8">
      <div id="error" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm"></div>

      <form id="registerForm" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
          <input type="email" id="email" required
                 class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                 placeholder="tuo@email.it">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
          <input type="password" id="password" required minlength="6"
                 class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                 placeholder="Minimo 6 caratteri">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Conferma password <span class="text-red-500">*</span></label>
          <input type="password" id="password2" required minlength="6"
                 class="w-full rounded-lg border border-gray-300 px-3 py-2 focus:ring-2 focus:ring-brand-500 focus:border-brand-500"
                 placeholder="Ripeti la password">
        </div>
        <button type="submit" id="btn"
                class="w-full py-2.5 rounded-lg bg-brand-600 text-white font-medium hover:bg-brand-700 transition">
          Crea account
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-gray-500">
        Hai già un account?
        <a href="/login" class="text-brand-600 font-medium hover:underline">Accedi</a>
      </p>
    </div>
  </div>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn');
      const err = document.getElementById('error');
      err.classList.add('hidden');

      const pw = document.getElementById('password').value;
      const pw2 = document.getElementById('password2').value;
      if (pw !== pw2) {
        err.textContent = 'Le password non coincidono';
        err.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Registrazione in corso…';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value,
            password: pw,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.detail || 'Errore di registrazione');
        window.location.href = '/onboarding';
      } catch (ex) {
        err.textContent = typeof ex.message === 'string' ? ex.message : 'Errore di registrazione';
        err.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Crea account';
      }
    });
  </script>
</body>
</html>
